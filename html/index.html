<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="../css/miestilo.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="login">
    <!-- Panel izquierdo: solo se ve en escritorio (@media en el css) -->
    <aside>
        <img src="../img/Worldwide_FM_logo_GTA-V.png" alt="">
        <strong>World Wide FM</strong>
        <h2>Sintoniza la frecuencia global</h2>
        <p>La radio que redefine el sonido urbano, directamente en tu escritorio. Conéctate con miles de oyentes en todo el mundo.</p>
    </aside>

    <header>
        <img id="logoPrincipal" src="../img/Worldwide_FM_logo_GTA-V.png" alt="World Wide FM">
        <h1>Bienvenido de vuelta</h1>
    </header>

    <main>
        <div class="miWeb">
            <form>
                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="alvaro@educa.madrid.org"
                        autocomplete="email">
                </div>

                <div class="campo">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" placeholder="••••••••••••"
                        autocomplete="current-password">
                    <button type="button" id="verContrasena" aria-label="Mostrar u ocultar contraseña"><i class="bi bi-eye"></i></button>
                </div>

                <a href="#">¿Se te olvidó la contraseña?</a>

                <button type="button">Iniciar Sesión</button>
            </form>

            <p>O continúa con</p>

            <button type="button"><i class="bi bi-google"></i> Google</button>
            <button type="button"><i class="bi bi-apple"></i> Apple</button>

            <p>¿Nuevo en World Wide FM? <a href="#">Crea una cuenta</a></p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 WORLD WIDE FM</p>
    </footer>

    <button type="button" id="theme-toggle" aria-pressed="false"><i class="bi bi-moon-fill"></i></button>

    <script src="../js/script.js"></script>
</body>

</html>
